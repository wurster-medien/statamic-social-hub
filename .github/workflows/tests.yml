name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Wöchentlich, damit neue Sicherheitsmeldungen zu Abhängigkeiten (composer audit) auffallen.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Statamic ${{ matrix.statamic }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        statamic: ['^5.0', '^6.0']
        include:
          # composer.json erlaubt PHP 8.2, das deckt nur Statamic 5 ab.
          - php: '8.2'
            statamic: '^5.0'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl, fileinfo
          coverage: none

      - name: Abhängigkeiten installieren
        run: |
          composer require "statamic/cms:${{ matrix.statamic }}" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Bekannte Sicherheitslücken in Abhängigkeiten
        run: composer audit

      - name: Tests
        run: vendor/bin/phpunit
